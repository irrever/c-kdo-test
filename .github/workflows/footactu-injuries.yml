name: footactu injuries

on:
  schedule:
    # Every day at 06:17 UTC. Incremental: only articles modified since the last run are fetched.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-crawl the whole archive"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: footactu-injuries
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and analyse
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python3 footactu/collect.py --full --delay 1.0
          else
            python3 footactu/collect.py --delay 1.0
          fi

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add footactu/data
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "footactu: update injury data ($(date -u +%Y-%m-%d))"
            git push
          fi
