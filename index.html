/* ---------- mode gratuit : carte et message, sans paiement ---------- */
/* Code de référence du virement optionnel : sans caractères ambigus (0/O, 1/I) */
const REF_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newRefCode() {
  const b = crypto.getRandomValues(new Uint8Array(8));
  return 'CK-' + Array.from(b, (x) => REF_CHARS[x % REF_CHARS.length]).join('');
}
function refCodeNow() { if (!S.refCode) S.refCode = newRefCode(); return S.refCode; }
/* Virement optionnel, hors application : rien n’est prélevé ici. Le bloc n’apparaît que si l’IBAN est renseigné. */
function transferBlockHtml(ref) {
  if (!TRANSFER.iban) return '';
  return `<div class="zsep"></div>
    <div class="ztitle">Virement optionnel</div>
    <div class="hint">Facultatif. Le virement se fait depuis votre banque, hors de l’application : rien n’est prélevé ici. Indiquez ce code dans le libellé.</div>
    <div class="linkbox" id="refCode">${esc(ref)}</div>
    <div class="rowline"><span>Titulaire</span><span>${esc(TRANSFER.titulaire)}</span></div>
    <div class="rowline"><span>IBAN</span><span>${esc(TRANSFER.iban)}</span></div>`;
}
/* ---------- mode entraînement : crédits fictifs (sans valeur en euros) ---------- */
/* Un compte par appareil : une clé tirée au hasard, gardée ici. Le serveur ne garde que son empreinte. */
const credTxt = (n) => `${n} Kdo`;
/* Montant de la carte en Kdo : choisi par l’expéditeur, jamais en dessous de son coût calculé. Carte d’option : 0 Kdo. */
function credAmountOf() {
  if (S.optionCard) return 0;
  return CREDIT_CARD;
}
/* Texte sous la carte, à l’étape de création et au récapitulatif */
const creditCostText = () => {
  if (S.optionCard) return 'Carte d’option : elle ne contient aucun Kdo.';
  const n = credAmountOf();
  return `${Number.isInteger(n) ? `Cette carte contient ${credTxt(n)}.` : 'Montant à corriger.'} Coût minimum : ${credTxt(cardCredits())}.`;
};
/* Erreur sur le montant ou la carte d’option ; vide quand tout va */
function creditAmountMsg() {
  if (S.optionCard) return CRED.optionCards > 0 ? '' : 'Vous n’avez plus de carte d’option.';
  const n = credAmountOf();
  if (!Number.isInteger(n)) return 'Indiquez le montant en Kdo, en chiffres entiers.';
  if (n < cardCredits()) return `Une carte ne peut pas être envoyée sous sa valeur : ${credTxt(cardCredits())} minimum.`;
  return '';
}
/* Champ « Kdo envoyés » : suit le coût tant que l’expéditeur n’a pas tapé son propre montant (mode gratuit) */
function syncCreditAmountInput() {
  if (!CREDITS) return;
  creditRaiseToMin();
  const i = document.getElementById('credAmount');
  if (i) {
    i.min = String(cardCredits());
    if (S.credAmount === null) i.value = String(cardCredits());
    else if (Number.isFinite(S.credAmount) && document.activeElement !== i) i.value = String(S.credAmount);
  }
  const ce = document.getElementById('creditAmountErr');
  if (ce) { const m = creditAmountMsg(); ce.textContent = m; ce.style.display = m ? '' : 'none'; }
  updatePreview();
}
/* Bloc « Kdo envoyés » de l’étape création : montant modifiable vers le haut, carte d’option si le lot le permet */
/* Somme saisie à la main : elle monte au minimum quand le message ajoute un coût */
function creditRaiseToMin() {
  const cost = cardCredits();
  const prev = S.credCostSeen === undefined ? cost : S.credCostSeen;
  if (S.credAmount !== null && Number.isFinite(S.credAmount) && S.credAmount < cost && cost > prev) S.credAmount = cost;
  S.credCostSeen = cost;
}
function creditAmountBlockHtml() {
  creditRaiseToMin();
  const cost = cardCredits();
  const raw = S.credAmount === null ? cost : Number.isFinite(S.credAmount) ? S.credAmount : '';
  const msg = creditAmountMsg();
  const showOpt = CRED.optionCards > 0 || S.optionCard;
  return `
    <div class="label">Kdo envoyés</div>
    <input id="credAmount" class="field" type="number" inputmode="numeric" step="1" min="${cost}" value="${esc(String(raw))}"${S.optionCard ? ' disabled' : ''}>
    <div class="hint">Au moins ${esc(credTxt(cost))} pour cette carte. Vous pouvez en mettre davantage : le destinataire reçoit le montant choisi.</div>
    ${showOpt ? `<label class="check"><input id="optionCard" type="checkbox" ${S.optionCard ? 'checked' : ''}> <span>Carte d’option, sans Kdo, pour répondre à une carte reçue. Il vous reste ${CRED.optionCards} carte(s) d’option.</span></label>` : ''}
    <div class="blockErr" id="creditAmountErr" style="${msg ? '' : 'display:none'}">${esc(msg)}</div>`;
}
const balanceText = () => (CRED.balance === null ? '…' : credTxt(CRED.balance));
const dureeTxt = (ms) => {
  const total = Math.max(1, Math.ceil(ms / 60000));
  const h = Math.floor(total / 60), m = total % 60;
  return h > 0 ? `${h} h ${String(m).padStart(2, '0')}` : `${m} min`;
};
/* Compte à rebours de recharge à 100 Kdo : factuel, aucun appel à acheter à côté */
function rechargeHtml() {
  if (CRED.balance === null) return '';
  if (CRED.balance >= CREDIT_REFILL) return `<div class="rebours"><div class="rebours-lbl">Recharge à ${CREDIT_REFILL} Kdo</div><div class="hint" style="margin:6px 0 0">Pas de compte à rebours : votre solde est à ${CREDIT_REFILL} Kdo ou plus.</div></div>`;
  const ms = CRED.recharge ? CRED.recharge - Date.now() : 0;
  if (ms <= 0) return `<div class="rebours"><div class="rebours-lbl">Recharge à ${CREDIT_REFILL} Kdo</div><div class="rebours-val">En cours…</div></div>`;
  return `<div class="rebours"><div class="rebours-lbl">Recharge à ${CREDIT_REFILL} Kdo dans</div><div class="rebours-val" data-until="${CRED.recharge}">${esc(dureeTxt(ms))}</div></div>`;
}
/* Mise à jour toutes les 30 secondes ; à zéro, le solde est relu une fois */
function tickRecharge() {
  let fini = false;
  document.querySelectorAll('[data-until]').forEach((el) => {
    const ms = Number(el.dataset.until) - Date.now();
    if (ms <= 0) { fini = true; el.textContent = 'En cours…'; return; }
    el.textContent = dureeTxt(ms);
  });
  if (fini) refreshCreditsView();
}
setInterval(tickRecharge, 30000);
/* Coût d’une carte selon son contenu : même règle que credit_cost() côté serveur */
function cardCredits() {
  return CREDIT_CARD;
}
function credKey() {
  const v = store.get(KEY_COMPTE, null);
  if (v && typeof v.key === 'string' && v.key.length >= 32) return v.key;
  const key = Array.from(crypto.getRandomValues(new Uint8Array(24)), (x) => x.toString(16).padStart(2, '0')).join('');
  store.set(KEY_COMPTE, { key });
  return key;
}
function applyCredState(d) {
  CRED.id = String(d.id || CRED.id);
  CRED.balance = Number(d.balance);
  CRED.recharge = d.recharge_at ? Date.parse(d.recharge_at) : null;
  CRED.optionCards = Number(d.option_cards) || 0;
  CRED.survival = Number(d.survival_credits) || 0;
}
/* Ouvre le compte si besoin (solde 0 au premier usage, compte à rebours dès l’ouverture) et lit le solde, après recharge éventuelle */
async function credLoad() {
  if (!CREDITS || !sb) return;
  CRED.key = CRED.key || credKey();
  const { data, error } = await sb.rpc('credit_open', { p_key: CRED.key });
  if (error) throw error;
  applyCredState(data);
}
/* État des cartes liées au compte : Kdo, encaissement, date d’expiration */
async function credCardsLoad() {
  const ids = [...new Set([...receivedList(), ...envoisList()].filter(isCreditCard).map((c) => c.id))];
  if (!ids.length) { CRED.cards = {}; return; }
  const { data, error } = await sb.rpc('credit_cards_status', { p_key: CRED.key, p_card_ids: ids });
  if (error) throw error;
  CRED.cards = Object.fromEntries((Array.isArray(data) ? data : []).map((r) => [r.id, r]));
}
/* Redessine l’écran de compte là où il est affiché : chez le destinataire, ou dans l’accueil du créateur */
function redrawCredits() {
  if (RECV) {
    if (recvView === 'account') drawRecv();
    else if (recvView === 'card') refreshRecvRest();
    return;
  }
  if (S.step === 'compte') render();
}
async function refreshCreditsView() {
  if (!CREDITS || !sb) return;
  try {
    await credLoad();
    await credCardsLoad();
    CRED.error = '';
  } catch (err) {
    CRED.error = rpcMsg(err);
  }
  redrawCredits();
}
/* Carte envoyée depuis cet appareil : les crédits sont débités par le serveur, puis la carte existe */
async function submitCredits() {
  if (!sb) { S.error = 'Le serveur n’est pas encore branché.'; return render(); }
  const msgErr = creditAmountMsg();
  if (msgErr) { S.error = msgErr; return render(); }
  const option = !!S.optionCard;
  const amount = credAmountOf();
  if (!option && CRED.balance !== null && CRED.balance < amount) {
    S.error = `Solde insuffisant : cette carte contient ${credTxt(amount)}, et il vous en reste ${credTxt(CRED.balance)}.`;
    return render();
  }
  S.busy = true; S.error = ''; render();
  /* Un nouvel essai reprend le même identifiant : le serveur ne débite pas deux fois */
  const id = S.soloIds && S.soloIds.length === 1 ? S.soloIds[0] : crypto.randomUUID();
  S.soloIds = [id];
  try {
    CRED.key = CRED.key || credKey();
    let mediaPath = null;
    if (S.mediaFile) {
      mediaPath = `${id}/media.${extOf(S.mediaFile.type)}`;
      await uploadOnce(mediaPath, S.mediaFile);
    }
    const none = hasNoMessage();
    const msgType = none ? 'text' : S.msgType;
    let msgPath = null;
    if (msgType === 'voice') { msgPath = `${id}/voice.${extOf(S.voiceBlob.type)}`; await uploadOnce(msgPath, S.voiceBlob); }
    if (msgType === 'video') { msgPath = `${id}/msg-video.${extOf(S.msgVideoFile.type)}`; await uploadOnce(msgPath, S.msgVideoFile); }
    const message = none ? NO_MESSAGE_TEXT : msgType === 'text' ? S.message.trim() : msgType === 'voice' ? 'Message vocal' : 'Message vidéo';
    const row = {
      id, occasion: S.occasion, card_text: S.cardText.trim(), effect: S.fx,
      media_type: S.mediaFile ? (S.mediaIsVideo ? 'video' : 'photo') : 'none', media_path: mediaPath,
      msg_type: msgType, msg_media_path: msgPath, message, recipient_name: '',
      ...(S.fxExtra.length ? { extra_effects: S.fxExtra } : {}),
      ...(cropSet() ? { media_crop: S.crop } : {}),
      ...(msgCropSet() ? { msg_crop: S.msgCrop } : {}),
      ...(option ? { option: true } : { credit_amount: amount }),
    };
    const { data, error } = await sb.rpc('credit_send_card', { p_key: CRED.key, p_card: row });
    if (error) throw error;
    CRED.balance = Number(data.balance);
    CRED.optionCards = Number(data.option_cards) || 0;
    recordPhone();
    const base = `${CONFIG.PUBLIC_URL || location.href.split('?')[0]}?c=`;
    S.links = [base + id]; S.link = S.links[0]; S.soloMulti = false; S.collectionId = id;
    saveEnvois([...envoisList(), { id, solo: true, free: true, kind: 'entrainement', option_card: option, credits: Number(data.credits), recipientName: '', total: 0,
      links: S.links, sent: [null], opened: [null], createdAt: new Date().toISOString() }]);
    S.step = 'done';
  } catch (err) {
    S.error = rpcMsg(err);
    /* Erreur inconnue : on affiche aussi l'erreur reçue du serveur, entre parenthèses */
    if (S.error === 'Une erreur est survenue, réessayez.') S.error += ' (' + ((err && err.message) || err) + ')';

    S.busy = false;

/* Encaissement : les crédits de la carte passent sur le compte, une seule fois */
async function encaisserCarte(id) {
  if (CRED.busy || !sb) return;
  CRED.busy = id; CRED.msg = ''; redrawCredits();
  try {
    await credLoad();
    const { data, error } = await sb.rpc('credit_collect', { p_key: CRED.key, p_card_id: id });
    if (error) throw error;
    CRED.balance = Number(data.balance);
    CRED.msg = creditDoneMsg(data);
  } catch (err) {
    CRED.msg = rpcMsg(err);
  } finally {
    CRED.busy = '';
  }
  await refreshCreditsView();
}
/* Message après encaissement : une carte d’option n’apporte aucun Kdo */

}
/* Date de fin de validité, en français */

/* Prolongation : seul le destinataire qui a encaissé la carte peut la prolonger, avant son expiration (10 Kdo, ou une carte de survie) */

  if (Date.parse(st.expires_at) <= Date.now()) return '<div class="hint">Cette carte a expiré.</div>';
  const kdoOk = CRED.balance !== null && CRED.balance >= CREDIT_PROLONG_KDO && !CRED.busy;

/* Prolonger une carte encaissée : mode « kdo » (10 Kdo) ou « survie » (une carte de survie du stock) */

/* Cadeau à plusieurs clôturé : une carte par tranche de 500 € au plus, chacune avec sa personnalisation et son lien */
/* Envoi : une carte est envoyée quand le numéro est saisi et que le bouton SMS est touché. La date du premier envoi est gardée.
   La lecture (« Lue le … ») vient du serveur : c’est la seule preuve de réception. */
const sentAt = (item, k) => (item && Array.isArray(item.sent) && item.sent[k]) || null;
const readAt = (item, k) => (item && Array.isArray(item.opened) && item.opened[k]) || null;
const allSent = (item) => !!item && Array.isArray(item.links) && item.links.length > 0 && item.links.every((_, k) => !!sentAt(item, k));
const allRead = (item) => allSent(item) && item.links.every((_, k) => !!readAt(item, k));
const nRead = (item) => (Array.isArray(item.links) ? item.links.filter((_, k) => !!readAt(item, k)).length : 0);
const firstSent = (item) => (item.sent || []).filter(Boolean).sort()[0] || null;
const lastRead = (item) => (item.opened || []).filter(Boolean).sort().pop() || null;
const dateHeure = (iso) => frDateNb(Date.parse(iso));

/* Cartes solo : une entrée par carte, gardée sur cet appareil avec son lien (même forme qu’une collecte) */
const KEY_ENVOIS = 'ckdo.envois';
const envoisList = () => { const v = store.get(KEY_ENVOIS, []); return Array.isArray(v) ? v.filter((x) => x && x.id && x.solo && Array.isArray(x.links)) : []; };
const saveEnvois = (list) => store.set(KEY_ENVOIS, list);
const anyList = () => [...localList(), ...envoisList()];
/* Mise à jour d’une carte ou d’une collecte, dans la liste où elle se trouve */
function updateItem(id, patch) {
  if (envoisList().some((x) => x.id === id)) return saveEnvois(envoisList().map((x) => (x.id === id ? { ...x, ...patch(x) } : x)));
  saveLocalList(localList().map((x) => (x.id === id ? { ...x, ...patch(x) } : x)));
}
/* Bouton SMS touché : l’envoi de cette carte est noté, avec sa date (la première fois seulement) */
function markSent(id, k) {
  const now = new Date().toISOString();
  updateItem(id, (x) => ({ sent: x.links.map((_, i) => sentAt(x, i) || (i === k ? now : null)) }));
}

/* Lecture : relue sur le serveur à chaque retour sur l’accueil. Collecte : par sa clé de gestion. Carte solo : par son lien. */
const linkCardId = (l) => { const m = /[?&]c=([0-9a-f-]{36})/i.exec(String(l || '')); return m ? m[1].toLowerCase() : null; };
async function fetchOpened(item) {
  const ids = (item.links || []).map(linkCardId);
  if (!sb || !ids.length || ids.some((x) => !x)) return null;
  const { data, error } = item.solo
    ? await sb.rpc('cards_status', { p_card_ids: ids })
    : await sb.rpc('manage_cards_status', { p_id: item.id, p_key: item.manageKey, p_card_ids: ids });
  if (error) throw error;
  const rows = Array.isArray(data) ? data : [];
  return ids.map((cid) => { const r = rows.find((x) => x && String(x.id).toLowerCase() === cid); return r && r.opened_at ? r.opened_at : null; });
}
async function refreshReads() {
  await Promise.all(anyList().filter((x) => Array.isArray(x.links) && x.links.length).map(async (x) => {
    try {
      const opened = await fetchOpened(x);
      if (opened) updateItem(x.id, () => ({ opened }));
    } catch (err) { /* lecture indisponible : on garde la dernière date connue */ }
  }));
}

/* Carte de base telle qu’elle a été saisie à la création (cadeau seul). Gardée à part pendant l’édition d’une carte suivante. */
const baseSnapshot = () => ({
  cardText: S.cardText, textTouched: S.textTouched, fx: S.fx, fxTouched: S.fxTouched, fxTheme: S.fxTheme,
  fxExtra: [...S.fxExtra], mediaFile: S.mediaFile, mediaUrl: S.mediaUrl, mediaIsVideo: S.mediaIsVideo,
});
/* Remet en place la carte de base après l’édition d’une carte suivante */
function restoreBase() {
  if (!S.base) return;
  Object.assign(S, S.base, { fxExtra: [...S.base.fxExtra], addingFx: false, fxDup: '', mediaError: '' });
  S.base = null;
}

/* Ouvre l’édition de la carte k : sa personnalisation, ou la carte de base comme point de départ */
function enterCardEdit(k) {
  const solo = soloFlow();
  const c = solo ? null : getCollection(S.collectionId);
  if (!solo && !c) return render();
  if (solo && !S.base) S.base = baseSnapshot();
  /* Carte de base : celle du cadeau seul (gardée à part), ou celle de la collecte */
  const base = solo ? S.base
    : { cardText: c.card.cardText, fx: c.card.fx, fxExtra: c.card.fxExtra, mediaFile: null, mediaUrl: c.card.mediaUrl, mediaIsVideo: c.card.mediaIsVideo };
  const e = (S.groupCards || [])[k];
  const src = e && e.custom ? e : base;
  Object.assign(S, {
    editCard: k, step: 'cardedit', error: '',
    cardText: src.cardText, fx: src.fx, fxTheme: themeOf(src.fx), fxExtra: [...src.fxExtra],
    addingFx: false, fxDup: '', mediaFile: src.mediaFile || null, mediaUrl: src.mediaUrl || '',
    mediaIsVideo: !!src.mediaIsVideo, mediaError: '',
  });
  render();
}

/* Enregistre la carte en cours d’édition, puis revient à « Vos cartes ». Cadeau seul : la carte de base est remise en place. */
function saveCardEdit() {
  const k = S.editCard;
  const solo = soloFlow();
  const c = solo ? null : getCollection(S.collectionId);
  if (k == null || (!solo && !c)) return render();
  const text = S.cardText.trim();
  if (!text) { S.error = 'La dédicace ne peut pas être vide.'; return render(); }
  const prev = (S.groupCards || [])[k];
  const basePath = prev && prev.custom ? prev.mediaPath : (c ? c.card.mediaPath : null);
  groupCardsReset(solo ? splitCount() : splitAmounts(collTotal(c)).length);
  S.groupCards[k] = {
    custom: true,
    cardText: text,
    fx: S.fx,
    fxExtra: [...S.fxExtra],
    mediaFile: S.mediaFile,
    mediaUrl: S.mediaUrl,
    mediaIsVideo: S.mediaIsVideo,
    mediaPath: S.mediaFile ? null : (S.mediaUrl ? basePath : null),
  };
  restoreBase();
  S.editCard = null; S.error = ''; S.soloIds = null; S.step = 'cards';
  render();
}

/* Vue simple : un toucher sur la vidéo du message la lance (son automatique) ou la met en pause.
   La carte du haut démarre à la fin du message, avec son effet ; un toucher sur elle la met en pause ou la relance. */
function recvVideoTap(el) {
  /* el : le cadre du message (rôle « msg ») ou la vidéo de la carte (rôle « card ») */
  const v = el.tagName === 'VIDEO' ? el : el.querySelector('video');
  if (!v) return;
  if (el.dataset.role === 'msg') {
    if (v.ended) v.currentTime = 0;
    if (v.paused) { v.muted = false; v.play().catch(() => {}); } else v.pause();
    return;
  }
  if (v.paused) { v.muted = true; v.play().catch(() => {}); } else v.pause();
}
function wireRecvSimple() {
  const card = document.querySelector('#recvCard .card');
  const cv = card && card.querySelector('video');
  const mv = document.querySelector('#app .recvbox [data-role="msg"] video');
  const startCard = () => {
    if (!card) return;
    card.classList.remove('fxwait');
    if (cv) { cv.muted = true; cv.play().catch(() => {}); }
  };
  if (cv) {
    cv.addEventListener('play', () => card.classList.remove('fxwait'));
    cv.addEventListener('pause', () => card.classList.add('fxwait'));
  }
  /* Si le message ne se charge pas, la carte démarre quand même */
  if (mv) { mv.addEventListener('ended', startCard); mv.addEventListener('error', startCard); }
  else startCard();
}
/* Carte seule (ouverte depuis « Mon compte ») : les effets suivent la lecture de la carte */
function wireCardPause() {
  const card = document.querySelector('#recvCard .card');
  const cv = card && card.querySelector('video');
  if (!cv) return;
  cv.addEventListener('play', () => card.classList.remove('fxwait'));
  cv.addEventListener('pause', () => card.classList.add('fxwait'));
}

/* ---------- cadeau à plusieurs : créateur ---------- */
async function createCollection() {
  if (!sb) { S.error = 'Le serveur n’est pas encore branché.'; return render(); }
  S.busy = true; S.error = ''; render();
  const id = crypto.randomUUID();
  const manageKey = crypto.randomUUID();
  try {
    let mediaPath = null;
    if (S.mediaFile) {
      mediaPath = `${id}/media.${extOf(S.mediaFile.type)}`;
      await upload(mediaPath, S.mediaFile);
    }
    let msgPath = null;
    if (S.msgType === 'voice' && S.voiceBlob) {
      msgPath = `${id}/voice.${extOf(S.voiceBlob.type)}`;
      await upload(msgPath, S.voiceBlob);
    }
    if (S.msgType === 'video' && S.msgVideoFile) {
      msgPath = `${id}/msg-video.${extOf(S.msgVideoFile.type)}`;
      await upload(msgPath, S.msgVideoFile);
    }
    const none = hasNoMessage();
    const message = none ? NO_MESSAGE_TEXT : S.msgType === 'text' ? S.message.trim()
      : S.msgType === 'voice' ? 'Message vocal' : 'Message vidéo';
    const dl = DEADLINE_MS[S.deadlineKey];
    const { error } = await sb.rpc('create_collection', {
      p_id: id, p_manage_key: manageKey, p_recipient: S.recipient.trim(), p_creator: S.creatorName.trim(),
      p_deadline: dl ? new Date(Date.now() + dl).toISOString() : null,
      p_card_text: S.cardText.trim(), p_effect: S.fx, p_extra_effects: [...S.fxExtra],
      p_media_type: S.mediaFile ? (S.mediaIsVideo ? 'video' : 'photo') : 'none', p_media_path: mediaPath,
      p_msg_type: none ? 'text' : S.msgType, p_msg_media_path: msgPath, p_message: message,
      p_note: '', p_pay_link: '', p_open_at: S.schedule ? S.openDate : null,
      p_creator_part_id: crypto.randomUUID(), p_creator_amount: Math.round(S.amount),
      p_occasion: S.occasion, p_second_card: false,
    });
    if (error) throw error;
    /* La collecte existe : elle entre dans la liste de cet appareil, même si la relecture échoue */
    saveLocalList([...localList().filter((x) => x.id !== id), { id, manageKey, recipientName: S.recipient.trim(),
      status: 'collecte', deadline: dl ? Date.now() + dl : null, total: Math.round(S.amount), count: 1, createdAt: new Date().toISOString() }]);
    await loadManage(id, manageKey);
    S.collectionId = id; S.step = 'collect'; S.error = '';
  } catch (err) {
    S.error = rpcMsg(err);
  } finally {
    S.busy = false;
    render();
  }
}

function copyGroupLink(btn, link) {
  navigator.clipboard.writeText(link)
    .then(() => { btn.textContent = 'Lien copié'; })
    .catch(() => { btn.textContent = 'Copiez le lien ci-dessus'; });
}

function groupLink(c) {
  return `${CONFIG.PUBLIC_URL || location.href.split('?')[0]}?g=${c.id}`;
}
function manageLink(c) {
  return `${groupLink(c)}&m=${c.manageKey}`;
}

/* Texte envoyé aux amis : le petit mot du créateur, puis la demande de participation */
function shareTextOf(c) {
  const link = groupLink(c);
  /* Un seul lien dans le message : l'aperçu s'affiche, et le remboursement reste sur la page du groupe */
  const limit = c.deadline && Date.now() < c.deadline ? ` avant le ${frDateNb(c.deadline)}` : '';
  const mot = (c.note || '').trim() ? `${c.note.trim()}\n\n` : '';
  return `${mot}Je prépare un cadeau pour ${c.recipientName}. Ajoute ta part${limit} : ${link}`;
}
/* Ouvre la feuille de partage du téléphone (Messages, WhatsApp, Mail…) avec un texte prêt à envoyer */
function shareGroup(btn) {
  const c = getCollection(S.collectionId);
  if (!c) return;
  const link = groupLink(c);
  const text = shareTextOf(c);
  if (navigator.share) {
    navigator.share({ title: `Cadeau pour ${c.recipientName}`, text }).catch(() => {});
    return;
  }
  copyGroupLink(btn, link);
}

function savePayLink(t) {
  const v = t.value.trim();
  const err = document.getElementById('payErr');
  if (v && !httpsOk(v)) { t.classList.add('bad'); if (err) err.textContent = 'Le lien doit commencer par https://'; return; }
  t.classList.remove('bad');
  if (err) err.textContent = '';
  const c = getCollection(S.collectionId);
  if (!c) return;
  c.payLink = v;
  saveTexts();
}

/* Envoi d'un média : un nouvel essai ne renvoie pas un fichier déjà envoyé */
async function uploadOnce(path, blob) {
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: baseType(blob.type), upsert: false });
  if (error && !/exist|duplicate|409/i.test(`${error.message || ''} ${error.statusCode || ''}`)) throw error;
}

/* Un seul paiement : le total est réglé par le créateur, à l'envoi. Au-delà de 500 €, le total est réparti en cartes égales (500 € maximum chacune), chacune avec son lien. */
async function closeGroup() {
  const c = getCollection(S.collectionId);
  if (!c || c.status !== 'collecte') return render();
  const total = collTotal(c);
  if (total < MIN_AMOUNT) { S.error = `Le total doit atteindre ${MIN_AMOUNT} € pour envoyer la carte.`; return render(); }
  const parts = splitAmounts(total);
  /* Identifiants des cartes : gardés pendant la clôture, pour qu'un nouvel essai reprenne les mêmes cartes */
  if (!c.cardIds || c.cardIds.length !== parts.length) c.cardIds = parts.map((_, k) => (k === 0 ? c.id : crypto.randomUUID()));
  Object.assign(S, {
    amount: total, group: true, closedGroup: true, error: '', recipient: c.recipientName, cardText: c.card.cardText,
    fx: c.card.fx, fxExtra: [...c.card.fxExtra], schedule: c.card.schedule, openDate: c.card.openDate,
    msgType: c.card.msgType, message: c.card.msgText, mediaUrl: c.card.mediaUrl, mediaIsVideo: c.card.mediaIsVideo,
  });
  S.busy = true; render();
  try {
    for (let k = 0; k < parts.length; k++) {
      const own = k > 0 && S.groupCards && S.groupCards[k] && S.groupCards[k].custom ? S.groupCards[k] : null;
      let mediaPath = own ? own.mediaPath : c.card.mediaPath;
      if (own && own.mediaFile) {
        mediaPath = `${c.id}/carte-${k + 1}/media.${extOf(own.mediaFile.type)}`;
        await uploadOnce(mediaPath, own.mediaFile);
      }
      const mediaType = own ? (own.mediaUrl ? (own.mediaIsVideo ? 'video' : 'photo') : 'none')
        : (c.card.hasMedia ? (c.card.mediaIsVideo ? 'video' : 'photo') : 'none');
      const fxExtra = own ? own.fxExtra : c.card.fxExtra;
      const { error } = await sb.from('cards').insert({
        id: c.cardIds[k],
        occasion: c.occasion,
        card_text: own ? own.cardText : c.card.cardText,
        amount: parts[k],
        media_type: mediaType,
        media_path: mediaPath,
        msg_type: c.card.msgType,
        msg_media_path: c.card.msgMediaPath,
        message: c.card.message,
        recipient_name: c.recipientName,
        effect: own ? own.fx : c.card.fx,
        ...(fxExtra.length ? { extra_effects: fxExtra } : {}),
        ...(c.card.schedule ? { open_at: c.card.openDate } : {}),
      });
      /* 23505 : la carte existe déjà (essai précédent interrompu) : on continue sans la recréer */
      if (error && error.code !== '23505') throw error;
    }
    const { error: e2 } = await sb.rpc('manage_mark_sent', { p_id: c.id, p_key: c.manageKey });
    if (e2) throw e2;
    await loadManage(c.id, c.manageKey);
    const base = `${CONFIG.PUBLIC_URL || location.href.split('?')[0]}?c=`;
    S.links = c.cardIds.map((id) => base + id);
    S.link = S.links[S.links.length - 1];
    S.splitIndex = parts.length - 1;
    /* Liens gardés sur cet appareil : l'envoi peut être refait tant qu'il n'est pas confirmé */
    /* Juste après la création, aucune carte n’a pu être ouverte : le lien n’a pas encore été donné */
    saveLocalList(localList().map((x) => (x.id === c.id ? { ...x, links: S.links, sent: S.links.map(() => null), opened: S.links.map(() => null) } : x)));
    S.step = 'done';
  } catch (err) {
    S.error = 'Une erreur est survenue, réessayez. (' + (err.message || err) + ')';
  } finally {
    S.busy = false;
    render();
  }
}

/* Détail des sommes, montré seulement au moment de payer : les frais se calculent à l'envoi */
function sendSummaryHtml(c, titre = 'Détail du paiement', pied = '') {
  const total = collTotal(c);
  const effets = groupEffectsCount(c) * EFFECT_EXTRA_PRICE;
  const sched = c.card.schedule ? SCHEDULE_PRICE : 0;
  return `<div class="zone"><div class="ztitle">${titre}</div>
    <div class="payline"><span>Participations</span><span>${eur(total)}</span></div>
    <div class="payline"><span>Frais de service<small>7 % du montant, 2 € minimum</small></span><span>${eur(feeOf(total))}</span></div>
    ${extraCardsFee(total) ? `<div class="payline"><span>Cartes supplémentaires<small>${splitAmounts(total).length - 1} × ${EXTRA_CARD_FEE} €</small></span><span>${eur(extraCardsFee(total))}</span></div>` : ''}
    ${effets ? `<div class="payline"><span>Effets supplémentaires<small>Hors frais de service</small></span><span>${eur(effets)}</span></div>` : ''}
    ${sched ? `<div class="payline"><span>Ouverture le jour J<small>Envoi programmé</small></span><span>${eur(sched)}</span></div>` : ''}
    <div class="paytotal"><span>Vous payez</span><span>${eur(closeTotalOf(c))}</span></div>
    <div class="hint">Une seule fois. Vos amis ne paient rien. Après paiement, la carte est envoyée et ne peut plus être modifiée.</div>${pied}</div>`;
}

function homeHref() { return location.href.split('?')[0]; }

/* Page dédiée au paiement : plus rien à partager ici, un seul bouton pour payer */
function screenPay() {
  const c = getCollection(S.collectionId);
  if (!c || c.status !== 'collecte') return `${hdr('Cadeau à plusieurs', 'Clôturer et payer')}<div class="section"><div class="message">Cette collecte n’est plus ouverte.</div></div>`;
  const enough = collTotal(c) >= MIN_AMOUNT;
  return `
  ${hdr('Cadeau à plusieurs', 'Clôturer et payer', 'collect')}
  <div class="section">
    <div class="message">Vos amis ne pourront plus participer. La carte part tout de suite après le paiement.</div>
    ${sendSummaryHtml(c)}
    ${S.error ? `<div class="error">${esc(S.error)}</div>` : ''}
    ${S.busy ? '' : '<button class="secondary" data-act="go" data-val="collect">Revenir au partage</button>'}
  </div>
  <div class="foot"><button class="btn-envoi" data-act="closegrp" ${enough && !S.busy ? '' : 'disabled'}>${S.busy ? 'Paiement en cours…' : 'Payer ' + eur(closeTotalOf(c)) + ' et envoyer'}</button></div>`;
}

function screenCollect() {
  const c = getCollection(S.collectionId);
  if (!c) return S.loading
    ? `${hdr('Cadeau à plusieurs', 'Chargement')}<div class="section"><div class="hint">Chargement de la collecte…</div></div>`
    : `${hdr('Cadeau à plusieurs', 'Collecte introuvable')}<div class="section"><div class="error">Cette collecte n’est pas accessible.</div></div>`;
  if (c.status === 'annulee') {
    return `${hdr('Cadeau à plusieurs', 'Collecte annulée')}<div class="section"><div class="message">Vous avez annulé cette collecte. Aucun paiement n’a été pris, donc rien à rembourser. Les amis qui ouvrent le lien voient qu’elle est annulée.</div></div>`;
  }
  if (c.status === 'envoyee') {
    return `${hdr('Cadeau à plusieurs', 'Carte envoyée')}<div class="section"><div class="message">La carte a été envoyée. La collecte est terminée et ne peut plus être modifiée.</div></div>`;
  }
  const keys = [c.card.fx, ...c.card.fxExtra].filter((k) => k && k !== 'none');
  return `
  <header class="hdr"><button class="back" data-act="accueil" aria-label="Quitter et revenir plus tard">${ICON_BACK}</button><div><div class="step">Cadeau à plusieurs</div><div class="title">Invitez vos amis</div></div></header>
  <div class="section">
    <div class="stickycard">${cardMarkup({ text: c.card.cardText, amountText: collTotal(c) + ' €', mediaUrl: c.card.mediaUrl, isVideo: c.card.mediaIsVideo, fx: keys, tap: true })}</div>
    <div class="hint" style="text-align:center">Touchez la carte pour revoir les effets.</div>
    <div id="collectBody">${collectBodyHtml(c)}</div>
  </div>`;
}

/* Partie sous la carte : redessinée seule après chaque action, pour que la carte garde ses effets */
function collectBodyHtml(c) {
  const total = collTotal(c);
  const link = groupLink(c);
  const me = c.participants.find((p) => p.creator);
  const rows = c.participants.map((p) => {
    const paid = p.creator ? '' : `<button class="minibtn ${p.paid ? 'ok' : 'warn'}" data-act="paidpart" data-val="${esc(p.id)}" aria-pressed="${p.paid}">${p.paid ? 'Réglé' : 'Non réglé'}</button>`;
    const asking = !p.creator && S.rmPartAsk === p.id;
    const actions = asking
      ? `<div class="collrm"><div class="hint">Retirer la part de ${esc(p.name)} (${eur(p.amount)}) ?</div>
        <button class="secondary rec" data-act="rmpartok" data-val="${esc(p.id)}">Confirmer le retrait</button>
        <button class="linkbtn" data-act="rmpartno">Garder</button></div>`
      : `<div class="psub">${paid}${p.creator ? '' : `<button class="minibtn" data-act="rmpart" data-val="${esc(p.id)}">Retirer</button>`}</div>`;
    return `
    <div class="partrow">
      <div class="pmain"><span class="pname">${esc(p.name)}${p.creator ? ' <small>(vous)</small>' : ''}</span><span class="pamt">${eur(p.amount)}</span></div>
      ${actions}
    </div>`;
  }).join('');
  const enough = total >= MIN_AMOUNT;
  /* Un seul bouton de paiement, dans la zone d’envoi : le pied de page ne le répète plus */
  const pied = `${enough ? '<p class="footnote" style="margin-top:14px">Vos amis ne pourront plus participer. Vous réglez maintenant et la carte part tout de suite.</p>' : `<div class="error">Il faut au moins ${MIN_AMOUNT} € de participations pour envoyer la carte.</div>`}
    <button class="btn-envoi" style="margin-top:12px" data-act="gopay" ${enough ? '' : 'disabled'}>Clôturer et envoyer la carte à ${esc(c.recipientName)}</button>`;
  const cancelBtn = S.cancelAsk
    ? `<button class="secondary" data-act="cancelgrp">Confirmer l’annulation</button>
    <button class="linkbtn" data-act="keepgrp">Garder la collecte</button>`
    : `<button class="linkbtn" data-act="cancelgrp">Annuler la collecte</button>`;
  return `
    <div class="gstep">
      <div class="stephead">1. Inviter vos amis</div>
      <div class="label">Petit mot pour vos amis (facultatif)</div>
      <textarea id="groupNote" class="field" maxlength="200" rows="2" placeholder="Par exemple : Coucou ! On lui offre un cadeau ensemble.">${esc(c.note || '')}</textarea>
      <div class="hint"><span id="noteCount">${(c.note || '').length}</span> / 200 caractères. Il part avec le lien d’invitation.</div>
      <div class="label">Lien pour vous régler (facultatif)</div>
      <input id="payLink" class="field" maxlength="300" placeholder="https://…" value="${esc(c.payLink)}">
      <div class="error" id="payErr"></div>
      <div class="hint">Exemple : https://paypal.me/votrepseudo. Vos amis peuvent vous rembourser directement à ce lien. La plateforme ne vérifie pas les paiements. Seuls les liens https sont acceptés.</div>
      <button class="primary" data-act="sharegrp">Partager le lien à mes amis</button>
      <details class="morelink"><summary class="linkbtn" style="display:block;text-align:center;cursor:pointer;margin-top:10px">Voir ou copier le lien</summary>
        <div class="linkbox">${esc(link)}</div>
        <button class="secondary" data-act="copygrp" data-val="${esc(link)}">Copier le lien</button>
      </details>
      <div class="hint">Vos amis ajoutent leur part, sans payer.</div>
    </div>

    <div class="zone">
      <div class="ztitle">Participants (${c.participants.length})</div>
      ${cardsHint(total)}
      <div class="${c.deadline ? 'deadline' : 'deadline none'}">${esc(deadlineText(c))}</div>
      ${rows}
      <div class="paytotal"><span>Total des participations</span><span>${eur(total)}</span></div>
    </div>

    <div class="zone">
      <div class="ztitle">${me ? 'Ma part' : 'Rejoindre la collecte'}</div>
      <input id="mineAmount" class="field" type="text" inputmode="none" readonly data-kp data-maxlen="3" value="${me ? me.amount : ''}" placeholder="${MIN_PART}">
      <div class="kpslot" data-slot="mineAmount"></div>
      <button class="secondary" data-act="setmine">${me ? 'Enregistrer ma part' : 'Ajouter ma part'}</button>
      <div class="hint">Vous pouvez modifier votre part tant que la carte n’est pas envoyée.</div>
    </div>

    ${sendSummaryHtml(c, 'Envoyer la carte', pied)}

    <div class="others">
      <div class="stephead">Autres actions</div>
      <button class="secondary quit" data-act="accueil">Quitter et revenir plus tard</button>
      <div class="hint">La collecte reste ouverte. Retrouvez-la dans « Mes cadeaux à plusieurs », sur cet appareil.</div>
      ${cancelBtn}
      ${S.error ? `<div class="error">${esc(S.error)}</div>` : ''}
    </div>`;
}
/* Redessine seulement la partie sous la carte : la carte, ses effets et son son ne sont pas touchés */
function refreshCollect() {
  const c = getCollection(S.collectionId);
  const body = document.getElementById('collectBody');
  if (S.step !== 'collect' || !c || c.status !== 'collecte' || !body) return render();
  body.innerHTML = collectBodyHtml(c);
  setCardAmounts(collTotal(c) + ' €');
  updateStickyCard();
}
/* Montant affiché sur la carte, mis à jour sans redessiner la carte */
function setCardAmounts(text) {
  document.querySelectorAll('.stickycard .card .amt').forEach((e) => { e.textContent = text; });
}

/* ---------- cadeau à plusieurs : participant ---------- */
/* Message tel que le destinataire le verra : texte, vocal ou vidéo. Les participants y ont accès comme le créateur. */
function groupMessageHtml(c) {
  const url = publicUrl(c.card.msgMediaPath);
  if (c.card.msgType === 'voice' && url) return `<audio class="player" controls src="${esc(url)}"></audio>`;
  if (c.card.msgType === 'video' && url) return `<video class="player vid" controls playsinline src="${esc(url)}"></video>`;
  return `<div class="message">${esc(c.card.message)}</div>`;
}

function renderGroupView() {
  const c = getCollection(GROUP_ID);
  const back = homeBackHtml();
  if (!c) return `${recvHeader('Cadeau à plusieurs', 'Participer', back)}<div class="section">${S.loading ? '<div class="hint">Chargement…</div>' : '<div class="error">Ce lien n’est pas valide ou la carte n’existe plus.</div>'}</div>`;
  const total = collTotal(c);
  const keys = [c.card.fx, ...c.card.fxExtra].filter((k) => k && k !== 'none');
  const head = recvHeader('Cadeau à plusieurs', `Pour ${c.recipientName}`, back);

    <div class="stickycard">${cardMarkup({ text: c.card.cardText, amountText: total + ' €', mediaUrl: c.card.mediaUrl, isVideo: c.card.mediaIsVideo, fx: keys, tap: true })}</div>
    <div class="hint" style="text-align:center">Aperçu : la carte n’est pas encore envoyée. Touchez-la pour revoir les effets.</div>
    <div class="zone"><div class="ztitle">Message</div>${groupMessageHtml(c)}</div>

/* Liste des participations et actions sous la carte : redessinées seules, la carte garde ses effets */
function groupBodyHtml(c) {
  const total = collTotal(c);
  const creator = c.participants.find((p) => p.creator);
  const rows = c.participants.map((p) => `<div class="rowline"><span>${esc(p.name)}</span><span>${eur(p.amount)}</span></div>`).join('');
  const list = `<div class="ztitle" style="margin-top:18px">Participations · ${eur(total)}</div>${cardsHint(total)}${rows}`;
  const mine = myParts()[c.id];
  const me = mine ? { amount: mine.amount } : null;
  let action;
  if (me) {
    const payer = !!(creator && httpsOk(c.payLink || ''));
    const ouverte = !c.deadline || Date.now() < c.deadline;
    const nomCreateur = creator ? esc(creator.name) : 'le créateur';
    let apres;
    if (S.editMine) {
      /* Modification de sa part : même clavier que pour l'ajout */
      apres = `<div class="label" style="margin-top:18px">Votre nouvelle part (€)</div>
        <input id="editAmount" class="field" type="text" inputmode="none" readonly data-kp data-maxlen="3" value="${me.amount}">
        <div class="kpslot" data-slot="editAmount"></div>
        <div class="error" id="editErr"></div>
        <button class="primary" style="margin-top:12px" data-act="savemine">Enregistrer ma part</button>
        <button class="linkbtn" style="margin-top:10px;text-align:center;text-decoration:none" data-act="cancelmine">Annuler</button>`;
    } else if (S.myPaid === true) {
      /* Part réglée : plus de modification ni de remboursement depuis l'application */
      apres = `<div class="message" style="margin-top:18px">Votre part est réglée. Pour la modifier, contactez ${nomCreateur}.</div>`;
    } else {
      apres = (payer ? `<div class="message" style="margin-top:18px">Voulez-vous rembourser ${nomCreateur} directement ?</div><a class="primary" style="margin-top:12px" href="${esc(c.payLink)}" target="_blank" rel="noopener">Rembourser directement</a>` : '')
        + (ouverte ? `<button class="secondary" style="margin-top:12px" data-act="editmine">Modifier ma part</button>` : '');
    }
    action = `<div class="stephead" style="margin-top:18px">2. C’est noté</div>
      <div class="notice">Merci ! Votre part de ${eur(me.amount)} est ajoutée.</div>
      <div class="hint">Le créateur réglera le total et enverra la carte. Vous serez prévenu par SMS.</div>`
      + apres
      + `<a class="secondary" style="margin-top:14px" href="${esc(homeHref())}">Quitter</a>`;
  } else if (c.deadline && Date.now() >= c.deadline) {
    action = `<div class="message" style="margin-top:18px">Les participations sont closes. Le créateur va envoyer la carte.</div>`;
  } else {
    action = `
      ${c.deadline ? `<div class="deadline" role="status">Il reste ${remainingText(c.deadline)} pour participer.</div>` : ''}
      <div class="stephead" style="margin-top:18px">1. Ajoutez votre part</div>
      <div class="label">Votre prénom</div>
      <input id="gName" class="field" maxlength="30" placeholder="Par exemple : Marc">
      <div class="label">Votre part (€)</div>
      <input id="gAmount" class="field" type="text" inputmode="none" readonly data-kp data-maxlen="3" placeholder="${MIN_PART}">
      <div class="kpslot" data-slot="gAmount"></div>
      <div class="hint">De ${MIN_PART} € à ${MAX_AMOUNT} €.</div>

/* Modifier sa part, tant que le créateur n'a pas marqué « Réglé » */
async function groupEditClick(act) {
  if (act === 'editmine') { S.editMine = true; return refreshGroupBody(); }
  if (act === 'cancelmine') { S.editMine = false; return refreshGroupBody(); }
  const c = getCollection(GROUP_ID);
  if (!c || S.busy) return;
  const err = document.getElementById('editErr');
  const say = (m) => { if (err) err.textContent = m; };
  const amount = Math.round(Number((document.getElementById('editAmount') || {}).value));
  if (!(amount >= MIN_PART && amount <= MAX_AMOUNT)) return say(`Votre part doit être entre ${MIN_PART} € et ${MAX_AMOUNT} €.`);
  const mine = myParts()[c.id];
  if (!mine) return say('Cette participation n’est plus disponible sur cet appareil.');
  if (c.deadline && Date.now() >= c.deadline) return say(RPC_MSG.limite_depassee);
  S.busy = true; say('Enregistrement…');
  try {
    const { error } = await sb.rpc('update_my_part', { p_id: c.id, p_part_id: mine.partId, p_amount: amount });
    if (error) throw error;
    const parts = myParts(); parts[c.id] = { ...mine, amount }; store.set(PARTS_KEY, parts);
    S.editMine = false; S.busy = false;
    try { await loadPublic(c.id); await loadMyPaid(c.id); } catch (e3) { /* l'écran garde le montant enregistré */ }
    refreshGroupBody();
  } catch (e2) {
    S.busy = false;
    /* Réglée entre-temps : on affiche l'état réglé, sans message d'erreur */
    if (String((e2 && e2.message) || '').includes('deja_regle')) { S.editMine = false; S.myPaid = true; return refreshGroupBody(); }
    say(rpcMsg(e2));
  }
}

async function groupClick(e) {
  const edit = e.target.closest('[data-act="editmine"], [data-act="savemine"], [data-act="cancelmine"]');
  if (edit) return groupEditClick(edit.dataset.act);

  const c = getCollection(GROUP_ID);
  if (!c || c.status !== 'collecte' || (c.deadline && Date.now() >= c.deadline)) return redrawGroup();
  const err = document.getElementById('gErr');
  const say = (m) => { if (err) err.textContent = m; };
  const name = document.getElementById('gName').value.trim();
  const amount = Math.round(Number(document.getElementById('gAmount').value));
  const phone = document.getElementById('gPhone').value.replace(/[\s.-]/g, '');

  if (!name) return say('Indiquez votre prénom.');
  if (!(amount >= MIN_PART && amount <= MAX_AMOUNT)) return say(`Votre part doit être entre ${MIN_PART} € et ${MAX_AMOUNT} €.`);
  if (!/^(0[1-9]\d{8}|\+\d{8,14})$/.test(phone)) return say('Indiquez un numéro de téléphone valide.');
  if (!consent) return say('Cochez la case pour que nous puissions vous prévenir.');
  const partId = crypto.randomUUID();

let lastStep = '';
/* Carte collée : une fois arrivée en haut de l'écran, elle se réduit pour laisser la place au formulaire */
/* La carte se réduit en se collant. Elle ne regrandit qu'après avoir remonté de 40 px (seuil à deux niveaux),
   pour ne pas basculer en boucle au seuil. L'étape 3 garde toujours la carte en taille normale. */
/* La réduction ne doit pas faire bouger le formulaire : la marge du dessous compense la hauteur libérée,
   donc la hauteur totale de la section reste la même dans les deux tailles. */
function setStickySmall(s, on) {
  if (on) {
    s.style.marginBottom = '0px';
    const grande = s.offsetHeight;
    s.classList.add('is-small');
    const petite = s.offsetHeight;
    /* La marge se combine avec la marge du haut de l'élément suivant : on ajoute celle-ci pour garder le même écart */
    const suivant = s.nextElementSibling;
    const margeSuivant = suivant ? Math.max(0, parseFloat(getComputedStyle(suivant).marginTop) || 0) : 0;
    s.style.marginBottom = (margeSuivant + Math.max(0, grande - petite)) + 'px';
  } else {
    s.classList.remove('is-small');
    s.style.marginBottom = '';
  }
}
function updateStickyCard() {
  document.querySelectorAll('.stickycard').forEach((s) => {
    if (s.closest('.section.cr:not(.crf)')) return;
    if (s.classList.contains('fixed-full')) { if (s.classList.contains('is-small')) setStickySmall(s, false); return; }
    const top = s.getBoundingClientRect().top;
    if (s.classList.contains('is-small')) { if (top > 40) setStickySmall(s, false); }
    else if (top <= 0.5) setStickySmall(s, true);
  });
}
window.addEventListener('scroll', updateStickyCard, { passive: true });
function render() {
  const screens = { create: CREDITS ? screenCreateCredits : screenCreate, mes: screenMes, compte: screenCompte, amount: screenAmount, message: screenMessage, recap: screenRecap, collect: screenCollect, cards: screenCards, cardedit: screenCardEdit, pay: screenPay, done: screenDone, resend: screenResend };
  const banner = configured ? '' : '<div class="banner">Serveur non branché : la création de cartes est désactivée pour l’instant.</div>';
  /* Filet de sécurité : une erreur d'affichage ne laisse plus une page blanche */
  try {
    app.innerHTML = banner + screens[S.step]();
  } catch (err) {
    console.error(err);
    app.innerHTML = `${banner}<div class="section"><div class="error">Un problème est survenu sur cette page.</div><button class="primary" style="margin-top:12px" data-act="reset">Recommencer</button></div>`;
  }
  /* Changement d'écran : on remonte en haut, pour voir le début du nouvel écran */
  if (S.step !== lastStep) { lastStep = S.step; window.scrollTo(0, 0); }
  /* Écran réel : carte à taille fixe, réduite */
  document.querySelectorAll('.section.cr:not(.crf) .stickycard').forEach((s) => { if (!s.classList.contains('is-small')) setStickySmall(s, true); });
  updateStickyCard();
  attachLive();
  ensureMsgThumb();
  saveDraft();
}

/* ---------- média de la carte ---------- */
async function handleCardFile(file) {
  if (!file) return;
  S.error = ''; S.mediaError = '';
  if (file.size > MAX_FILE_BYTES) { S.mediaError = 'Fichier trop lourd (50 Mo maximum).'; return showMediaError(); }
  const isVideo = file.type.startsWith('video/');
  const url = URL.createObjectURL(file);
  if (isVideo) {
    const dur = await mediaDuration(url, 'video');
    if (!(dur > 0)) { URL.revokeObjectURL(url); S.mediaError = 'Cette vidéo ne peut pas être lue par ce navigateur. Choisissez une autre vidéo, de 10 secondes maximum, ou une photo.'; return showMediaError(); }
    if (dur > MAX_CARD_VIDEO_SECONDS + 0.5) { URL.revokeObjectURL(url); S.mediaError = `Cette vidéo dure ${Math.round(dur)} secondes. La vidéo de la carte doit durer ${MAX_CARD_VIDEO_SECONDS} secondes maximum : choisissez une vidéo plus courte ou une photo.`; return showMediaError(); }
  }
  if (S.mediaUrl && !(S.base && S.base.mediaUrl === S.mediaUrl)) URL.revokeObjectURL(S.mediaUrl);
  Object.assign(S, { mediaFile: file, mediaIsVideo: isVideo, mediaUrl: url, mediaError: '', crop: cropDefault() });
  render();
}

/* ---------- message vocal ---------- */
let recorder = null;
let recTimerId = null;
let recStartedAt = 0;

function stopVoice() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
}

async function startVoice() {
  S.error = '';
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    S.error = `Micro refusé (${err.name}). Choisissez un fichier audio à la place.`;
    return render();
  }
  let rec;
  try {
    rec = new MediaRecorder(stream);
  } catch (err) {
    stream.getTracks().forEach((t) => t.stop());
    S.error = 'Enregistrement non disponible sur ce navigateur. Choisissez un fichier audio.';
    return render();
  }
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    clearTimeout(recTimerId);
    stream.getTracks().forEach((t) => t.stop());
    const blob = new Blob(chunks, { type: rec.mimeType || 'audio/mp4' });
    if (S.voiceUrl) URL.revokeObjectURL(S.voiceUrl);
    Object.assign(S, {
      voiceBlob: blob,
      voiceUrl: URL.createObjectURL(blob),
      voiceSecs: Math.max(1, Math.round((Date.now() - recStartedAt) / 1000)),
      recording: false,
    });
    recorder = null;
    render();
  };
  recorder = rec;
  recStartedAt = Date.now();
  rec.start();
  S.recording = true;
  recTimerId = setTimeout(stopVoice, MAX_VOICE_SECONDS * 1000);
  render();
  const tick = setInterval(() => {
    const el = document.getElementById('recTimer');
    if (!S.recording) { clearInterval(tick); return; }
    if (el) el.textContent = fmt(Math.floor((Date.now() - recStartedAt) / 1000));
  }, 250);
}

async function handleVoiceFile(file) {
  if (!file) return;
  S.error = '';
  if (file.size > MAX_FILE_BYTES) { S.error = 'Fichier trop lourd (50 Mo maximum).'; return render(); }
  const url = URL.createObjectURL(file);
  const dur = await mediaDuration(url, 'audio');
  if (!(dur > 0)) { URL.revokeObjectURL(url); S.error = 'Ce format audio n’est pas lu par ce navigateur.'; return render(); }
  if (isFinite(dur) && dur > MAX_VOICE_SECONDS + 0.5) { URL.revokeObjectURL(url); S.error = `Le vocal dure ${Math.round(dur)} secondes. Maximum : ${MAX_VOICE_SECONDS} secondes.`; return render(); }
  if (S.voiceUrl) URL.revokeObjectURL(S.voiceUrl);
  Object.assign(S, { voiceBlob: file, voiceUrl: url, voiceSecs: isFinite(dur) ? Math.round(dur) : 0 });
  render();
}

/* ---------- message vidéo (fichier filmé ou choisi) ---------- */
async function handleMsgVideo(file) {
  if (!file) return;
  S.error = '';
  if (file.size > MAX_FILE_BYTES) { S.error = 'Fichier trop lourd (50 Mo maximum).'; return render(); }
  const url = URL.createObjectURL(file);
  const dur = await mediaDuration(url, 'video');
  if (!(dur > 0)) { URL.revokeObjectURL(url); S.error = 'Ce format de vidéo n’est pas lu par ce navigateur.'; return render(); }
  if (isFinite(dur) && dur > MAX_MSG_VIDEO_SECONDS + 0.5) { URL.revokeObjectURL(url); S.error = `La vidéo dure ${Math.round(dur)} secondes. Maximum : ${MAX_MSG_VIDEO_SECONDS} secondes.`; return render(); }
  if (S.msgVideoUrl) URL.revokeObjectURL(S.msgVideoUrl);
  Object.assign(S, { msgVideoFile: file, msgVideoUrl: url, msgVideoSecs: isFinite(dur) ? Math.round(dur) : 0, msgCrop: cropDefault(), msgCropLocked: false });
  render();
}

/* Cadeau seul : toutes les cartes sont créées ici, en une fois, pour un seul paiement. Chaque carte garde son texte, ses effets et son média. */
async function submit() {
  if (!sb) { S.error = 'Le serveur n’est pas encore branché.'; return render(); }
  S.busy = true; S.error = ''; render();
  /* Une carte par tranche de 500 € (une seule si le montant est ≤ 500 €). Les identifiants sont gardés : un nouvel essai reprend les mêmes cartes. */
  const parts = splitAmounts(S.amount);
  const ids = S.soloIds && S.soloIds.length === parts.length ? S.soloIds : parts.map(() => crypto.randomUUID());
  S.soloIds = ids;
  const id = ids[0];
  const multi = parts.length > 1;
  try {
    let mediaPath = null;
    if (S.mediaFile) {
      mediaPath = `${id}/media.${extOf(S.mediaFile.type)}`;
      await uploadOnce(mediaPath, S.mediaFile);
    }
    let msgPath = null;
    if (S.msgType === 'voice' && S.voiceBlob) {
      msgPath = `${id}/voice.${extOf(S.voiceBlob.type)}`;
      await uploadOnce(msgPath, S.voiceBlob);
    }
    if (S.msgType === 'video' && S.msgVideoFile) {
      msgPath = `${id}/msg-video.${extOf(S.msgVideoFile.type)}`;
      await uploadOnce(msgPath, S.msgVideoFile);
    }
    const none = hasNoMessage();
    const message = none ? NO_MESSAGE_TEXT : S.msgType === 'text' ? S.message.trim()
      : S.msgType === 'voice' ? 'Message vocal' : 'Message vidéo';
    const baseMedia = { path: mediaPath, type: S.mediaFile ? (S.mediaIsVideo ? 'video' : 'photo') : 'none' };
    for (let k = 0; k < parts.length; k++) {
      /* Carte 2 et suivantes personnalisées : ses propres texte, effets et média. Sinon, la carte de base. */
      const own = multi && k > 0 && S.groupCards && S.groupCards[k] && S.groupCards[k].custom ? S.groupCards[k] : null;
      let media = baseMedia;
      if (own && !own.mediaFile) media = { path: null, type: 'none' };
      else if (own && own.mediaFile !== S.mediaFile) {
        const path = `${id}/carte-${k + 1}/media.${extOf(own.mediaFile.type)}`;
        await uploadOnce(path, own.mediaFile);
        media = { path, type: own.mediaIsVideo ? 'video' : 'photo' };
      }
      const fxExtra = own ? own.fxExtra : S.fxExtra;
      const { error } = await sb.from('cards').insert({
        id: ids[k],
        occasion: S.occasion,
        card_text: own ? own.cardText : S.cardText.trim(),
        amount: parts[k],
        media_type: media.type,
        media_path: media.path,
        msg_type: none ? 'text' : S.msgType,
        msg_media_path: msgPath,
        message,
        recipient_name: S.recipient.trim(),
        effect: own ? own.fx : S.fx,
        ...(media === baseMedia && cropSet() ? { media_crop: S.crop } : {}),
        ...(!none && msgCropActive() ? { msg_crop: S.msgCrop } : {}),
        ...(fxExtra.length ? { extra_effects: fxExtra } : {}),
        ...(S.schedule ? { open_at: S.openDate } : {}),
        ...(FREE ? { kind: 'gratuit', ref_code: refCodeNow() } : {}),
      });
      /* 23505 : la carte existe déjà (essai précédent interrompu) : on continue sans la recréer */
      if (error && error.code !== '23505') throw error;
    }
    recordPhone();
    const base = `${CONFIG.PUBLIC_URL || location.href.split('?')[0]}?c=`;
    S.links = ids.map((cid) => base + cid);
    S.link = S.links[0];
    S.soloMulti = multi;
    /* Cadeau gardé sur cet appareil : il reste dans l’accueil tant que chaque carte n’est pas lue */
    saveEnvois([...envoisList(), { id, solo: true, ...(FREE ? { free: true, ref: refCodeNow() } : {}), recipientName: S.recipient.trim(), total: S.amount, links: S.links, sent: S.links.map(() => null), opened: S.links.map(() => null), createdAt: new Date().toISOString() }]);
    S.collectionId = id;
    S.step = 'done';
  } catch (err) {
    S.error = 'Une erreur est survenue, réessayez. (' + (err.message || err) + ')';
  } finally {
    S.busy = false;
    render();
  }
}

  }
  if (act === 'kp') { kpPress(el.dataset.target, v); return; }
  if (act === 'kpok') { closeKp(); return; }
  if (act === 'recvoice') { if (S.recording) stopVoice(); else startVoice(); return; }
  /* TEST : appui simultané sur « Filmer » et « Prendre une photo » : pas de caméra, la demande de code s’ouvre */
  if ((act === 'cardfilm' || act === 'cardphoto') && Date.now() < comboUntil) return;
  /* « Mon compte » sur la première page : déplie ou replie le bloc sur place */
  if (act === 'vidtap') { recvVideoTap(el); return; }
  if (act === 'comptetoggle') {
    S.acctOpen = !S.acctOpen; render();
    if (S.acctOpen) refreshCreditsView().then(() => { if (S.acctOpen && S.step === 'create') render(); });
    return;
  }
  if (act === 'codeok') return testCodeSubmit();
  /* Retour depuis « Votre carte est prête » : même contenu, pas de remise à zéro */
  if (act === 'backcreate') { S.step = 'create'; S.codeAsk = false; render(); window.scrollTo(0, 0); return; }
  if (act === 'codeno') { S.codeAsk = false; S.codeMsg = ''; S.codeBad = false; return render(); }
  if (act === 'camopen') return startLive();
  if (act === 'cardfilm') return startLive('card', 'video');
  if (act === 'cardphoto') return startLive('card', 'photo');
  if (act === 'camshot') return takePhoto();
  if (act === 'camflip') return flipCamera();
  if (act === 'camrec') { if (S.liveRecording) stopLive(); else recLive(); return; }
  if (act === 'camcancel') return cancelLive();
  if (act === 'msgrefilm') return refilmMsgVideo();
  if (act === 'submit') {
    if (CREDITS) return submitCredits();
    if (S.group && !amountOk()) { S.error = `Votre part doit être entre ${MIN_AMOUNT} € et ${MAX_AMOUNT} €.`; return render(); }
    if (S.group) return createCollection();
    /* Cadeau seul : le paiement attend des conditions acceptées et un numéro valide (retour au récapitulatif sinon) */
    if (!S.terms || !phoneOk(S.recipientPhone)) { S.step = 'recap'; S.showErrors = true; S.error = ''; return render(); }
    return CREDITS ? submitCredits() : submit();
  }
  if (act === 'sharelink') return shareCreditLink(el);
  if (act === 'copy') return copyLink(el);
  if (act === 'copygrp') return copyGroupLink(el, v);
  if (act === 'sharegrp') return shareGroup(el);
  if (act === 'gopay') {
    const cg = getCollection(S.collectionId);
    if (!cg || cg.status !== 'collecte' || collTotal(cg) < MIN_AMOUNT) return render();
    const n = splitAmounts(collTotal(cg)).length;
    groupCardsReset(n);
    S.step = n > 1 ? 'cards' : 'pay'; S.error = '';
    return render();
  }
  /* Cadeau seul en plusieurs cartes : le récapitulatif validé mène à « Vos cartes », où chaque carte se personnalise avant le paiement */
  if (act === 'tocards') {
    if (!soloMultiNow()) return render();
    groupCardsReset(splitCount());
    S.soloIds = null; S.error = ''; S.step = 'cards';
    return render();
  }
  if (act === 'paynext') { S.step = 'pay'; S.error = ''; return render(); }
  if (act === 'editcard') return enterCardEdit(Number(v));
  if (act === 'savecard') return saveCardEdit();
  if (act === 'samecard') { if (S.groupCards) S.groupCards[Number(v)] = null; S.soloIds = null; S.error = ''; return render(); }
  if (act === 'closegrp') return closeGroup();
  if (S.recording && act !== 'msgtype') stopVoice();
  switch (act) {
    case 'grp':
      S.group = v === 'group'; S.payChosen = true;
      if (S.step === 'create') return refreshCreateChoice();
      break;
    case 'paidpart': {
      const cp = getCollection(S.collectionId);
      const p = cp && cp.participants.find((x) => x.id === v);
      if (p) return manageAct('manage_set_paid', { p_part_id: v, p_paid: !p.paid });
      break;
    }
    case 'rmpart':
      S.rmPartAsk = v;
      break;
    case 'rmpartno':
      S.rmPartAsk = '';
      break;
    case 'rmpartok':
      S.rmPartAsk = '';
      return manageAct('manage_remove_part', { p_part_id: v });
    case 'setmine': {
      const c = getCollection(S.collectionId);
      if (!c || c.status !== 'collecte') break;
      const raw = document.getElementById('mineAmount');
      const amount = Math.round(Number(raw && raw.value));
      if (!(amount >= MIN_PART && amount <= MAX_AMOUNT)) { S.error = `Votre part doit être entre ${MIN_PART} € et ${MAX_AMOUNT} €.`; break; }
      const me = c.participants.find((p) => p.creator);
      if (!me) break;
      return manageAct('manage_set_part', { p_part_id: me.id, p_amount: amount });
    }
    case 'resend': {
      /* Renvoi : les liens et le nom sont gardés sur cet appareil ; le numéro est à saisir à nouveau */
      const item = anyList().find((x) => x.id === v);
      if (!item || !Array.isArray(item.links) || !item.links.length) break;
      Object.assign(S, { step: 'resend', collectionId: item.id, recipient: item.recipientName, recipientPhone: '', links: [...item.links], error: '' });
      break;
    }
    case 'rmcoll':
      S.removeAsk = v;
      break;
    case 'rmcollno':
      S.removeAsk = '';
      break;
    case 'rmcollok': {
      /* Retire la collecte de la liste de cet appareil seulement. Une collecte en cours ne se retire pas. */
      saveLocalList(localList().filter((x) => !(x.id === v && x.status !== 'collecte')));
      /* Carte solo : retirée seulement une fois lue */
      saveEnvois(envoisList().filter((x) => !(x.id === v && allRead(x))));
      S.removeAsk = '';
      break;
    }
    case 'keepgrp':
      S.cancelAsk = false;
      break;
    case 'cancelgrp':
      if (!S.cancelAsk) { S.cancelAsk = true; break; }
      S.cancelAsk = false;
      return manageAct('manage_cancel', {});
    case 'deadline':
      S.deadlineKey = v;
      break;
    case 'sched':
      S.schedule = v === 'later';
      break;
    case 'occasion':
      S.occasion = v;
      /* Le texte suggéré par l'occasion ne remplace pas un texte écrit à la main */
      if (!S.textTouched) S.cardText = OCCASIONS.find(([n]) => n === v)[1];
      /* Mise à jour ciblée : la carte et sa photo ne sont pas reconstruites */
      syncOccasionChips(); syncCardTextField(); updatePreview();
      /* Sans effet choisi à la main, l'occasion propose son effet. Si l'expéditeur a déjà choisi, son effet reste
         et s'affiche de nouveau, pour qu'il voie le résultat à chaque clic. */
      if (!S.fxTouched) {
        S.fx = OCC_FX[v];
        S.fxTheme = themeOf(S.fx);
        S.fxExtra = S.fx === 'none' ? [] : S.fxExtra.filter((k) => k !== S.fx);
        syncFxChips(); syncFxAdd();
      }
      playCardFx();
      /* « Autre » : le champ reçoit le curseur clignotant, pour inviter à écrire sa propre dédicace */
      if (v === 'Autre') { const f = document.getElementById('cardText'); if (f) { f.focus(); f.setSelectionRange(0, 0); } }
      return;
    case 'amount': {
      if (setStarted()) return;
      S.amount = Number(v); S.customRaw = '';
      syncAmountChips();
      const ci = document.getElementById('customAmount');
      if (ci) { ci.value = ''; liveCheck(ci); }
      updatePreview();
      return;
    }
    case 'removemedia':
      clearCardMedia();
      break;
    case 'fx': {
      /* Avec un effet gratuit et au moins un supplémentaire, un effet touché s'ajoute : le gratuit ne bouge plus */
      const ajouter = v !== 'none' && S.fx !== 'none' && (S.addingFx || S.fxExtra.length > 0);
      if (ajouter) {
        if (v === S.fx || S.fxExtra.includes(v)) {
          S.fxDup = v;                 /* déjà sur la carte */
          syncFxChips(); syncFxAdd();
          return;
        }
        S.addingFx = false; S.fxDup = '';
        if (S.fxExtra.length >= EFFECT_MAX - 1) { syncFxAdd(); return; }   /* trois effets au maximum, gratuit compris */
        S.fxExtra = [...S.fxExtra, v];
        syncFxChips(); syncFxAdd(); addCardFx(v);
        return;
      }
      /* Pas encore d'effet supplémentaire : toucher un effet choisit l'effet gratuit */
      S.addingFx = false; S.fxDup = '';
      S.fx = v; S.fxTouched = true;
      if (v === 'none') S.fxExtra = []; else S.fxTheme = themeOf(v);
      syncFxChips(); syncFxAdd(); playCardFx();
      return;
    }
    case 'addfx':
      S.addingFx = !S.addingFx; S.fxDup = '';
      syncFxAdd();
      return;
    case 'rmfx':
      S.fxExtra = S.fxExtra.filter((k) => k !== v);
      syncFxChips(); syncFxAdd(); playCardFx();
      return;
    case 'theme':
      if (S.addingFx || (S.fx !== 'none' && S.fxExtra.length)) { S.fxTheme = v; syncFxChips(); return; }
      /* Choisir un thème, c'est choisir son premier effet : le résultat s'affiche tout de suite sur la carte.
         Retaper le thème déjà ouvert ne change pas l'effet choisi. */
      if (v !== S.fxTheme || S.fx === 'none') {
        S.fxTheme = v;
        S.fx = FX_THEMES.find(([t]) => t === v)[1][0];
        S.fxTouched = true;
        syncFxChips(); syncFxAdd(); playCardFx();
      }
      return;
    case 'fxreplaybtn': {
      /* La carte reste collée en haut : inutile de remonter l'écran */
      playCardFx();
      return;
    }
    case 'sound': {
      /* Son de la vidéo de la carte : le toucher autorise la lecture avec le son */
      const card = el.closest('.card, .vcrop');
      const v = card && card.querySelector('video');
      if (v) { v.muted = !v.muted; if (v.paused) v.play().catch(() => {}); el.textContent = v.muted ? 'Activer le son' : 'Couper le son'; }
      return;
    }
    case 'fxreplay':
      replayCard(el.closest('.card'));
      return;
    case 'msgtype':
      if (S.recording) stopVoice();
      S.msgType = v; S.askNoMsg = false;
      syncMsgTabs(); updateMsgBody(); refreshMsgFoot();
      return;
    case 'writemsg': {
      S.askNoMsg = false; refreshMsgFoot();
      const ta = document.getElementById('message');
      if (ta) ta.focus();
      return;
    }
    case 'nomsg':
      S.askNoMsg = false; S.showErrors = false;
      if (CREDITS) return submitCredits();
      S.step = 'recap';
      break;
    case 'go':
      /* Somme (mode gratuit) : contrôlée avant le récapitulatif */
      if (CREDITS && v === 'recap' && creditAmountMsg()) { S.showErrors = true; syncCreditAmountInput(); return; }
      /* Retour depuis l’édition d’une carte : la carte de base est remise en place */
      restoreBase();
      S.error = ''; S.editCard = null; S.step = v;
      S.showErrors = false; S.touched = new Set(); S.askNoMsg = false;
      break;
    case 'mes':
      /* « Mes cartes » : écran dédié, la création en cours n’est pas touchée */
      S.step = 'mes'; S.error = '';
      break;
    case 'mesback':
      S.step = 'create'; S.error = '';
      break;
    case 'home':
      /* Retour à l'accueil dans l'application : on retire les paramètres de la collecte de l'adresse, sans recharger la page */
      try { history.replaceState(null, '', location.pathname); } catch (err) { /* aperçu sans adresse modifiable : on continue */ }
      Object.assign(S, initialState());
      break;
    case 'accueil':
      /* Retour à l'accueil depuis une collecte : elle reste dans « Mes cadeaux à plusieurs ». Rien de la création n'est effacé. */
      try { history.replaceState(null, '', location.pathname); } catch (err) { /* aperçu sans adresse modifiable : on continue */ }
      /* Une carte déjà créée est gardée dans la liste : la suivante repart d’une création vide (montant, mode, destinataire) */
      if (S.links.length) Object.assign(S, initialState());
      S.collectionId = ''; S.step = 'create'; S.loading = false; S.editMine = false; S.error = ''; S.busy = false;
      break;
    case 'reset':
      if (S.recording) stopVoice();
      Object.assign(S, initialState());
      break;
    default:
      return;
  }
  /* Sur l'écran de la collecte, seule la partie sous la carte est redessinée */
  if (S.step === 'collect') refreshCollect(); else render();
});

/* Glisser une carte terminée vers la gauche : révèle « Retirer » (la confirmation reste dans la liste) */
const SWIPE_W = 96;
let swipeDrag = null;
function setSwipe(el, open) {
  el.classList.toggle('is-open', open);
  el.querySelector('.collrow').style.transform = open ? `translateX(-${SWIPE_W}px)` : '';
}
app.addEventListener('touchstart', (e) => {
  const el = e.target.closest('.collslide[data-swipe]');
  if (!el || e.touches.length !== 1) { swipeDrag = null; return; }
  swipeDrag = { el, row: el.querySelector('.collrow'), x0: e.touches[0].clientX, y0: e.touches[0].clientY,
    base: el.classList.contains('is-open') ? -SWIPE_W : 0, dx: 0, moving: false };
}, { passive: true });
app.addEventListener('touchmove', (e) => {
  const s = swipeDrag;
  if (!s || !e.touches.length) return;
  const dx = e.touches[0].clientX - s.x0;
  const dy = e.touches[0].clientY - s.y0;
  if (!s.moving) {
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (ady > 8 && ady > adx) { swipeDrag = null; return; }   /* défilement vertical : on ne touche à rien */
    if (adx < 8) return;
    s.moving = true;
  }
  s.dx = dx;
  const x = Math.max(-SWIPE_W, Math.min(0, s.base + dx));
  s.row.style.transition = 'none';
  s.row.style.transform = `translateX(${x}px)`;
}, { passive: true });
function endSwipe() {
  const s = swipeDrag;
  swipeDrag = null;
  if (!s || !s.moving) return;
  const open = s.base + s.dx < -SWIPE_W / 2;
  s.row.style.transition = '';
  setSwipe(s.el, open);
}
app.addEventListener('touchend', endSwipe, { passive: true });
app.addEventListener('touchcancel', endSwipe, { passive: true });
/* Une carte ouverte se referme au toucher, sans ouvrir la collecte */
app.addEventListener('click', (e) => {
  const open = e.target.closest('.collslide.is-open');
  if (!open || e.target.closest('.collswipe')) return;
  e.preventDefault(); e.stopPropagation();
  setSwipe(open, false);
}, true);

/* Quitter un champ vide le signale en rouge */
app.addEventListener('focusout', (e) => {
  const t = e.target;
  if (!['cardText', 'customAmount', 'recipient', 'recipientPhone', 'message', 'creatorName'].includes(t.id)) return;
  S.touched.add(t.id);
  liveCheck(t);
});

app.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'payLink') return savePayLink(t);
  if (t.id === 'optionCard') { S.optionCard = t.checked; S.error = ''; return render(); }
  if (t.id === 'fileCard') return handleCardFile(t.files[0]);
  if (t.id === 'voiceFile') return handleVoiceFile(t.files[0]);
  if (t.id === 'vidCam' || t.id === 'vidFile') return handleMsgVideo(t.files[0]);
